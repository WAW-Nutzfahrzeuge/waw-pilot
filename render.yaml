services:
  - type: web
    name: waw-zugferd-service
    runtime: docker
    plan: free
    rootDir: services/zugferd-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: ZUGFERD_SERVICE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ZUGFERD_QUEUE_POLL_MS
        value: "1500"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: GHOSTSCRIPT_COMMAND
        value: gs
      - key: VERAPDF_COMMAND
        value: verapdf
      - key: ICC_PROFILE_PATH
        value: /usr/share/color/icc/ghostscript/srgb.icc
